# CI: build + verify on every push/PR.
#
# CI is deliberately the *honest* environment: unrestricted network means it
# compiles against the real ideaIC-2025.2 floor (the tenant dev sandbox
# can't reach the JetBrains CDN and uses a local IDE via the
# `marginalis.localIde` property instead) and runs the Plugin Verifier
# against JetBrains' recommended IDE set for our since-build range.
name: CI

on:
  push:
    # schreko_stable is the fork's integration branch: its pushes also fill the Gradle cache its pull requests read.
    branches: [main, schreko_stable]
  pull_request:

# A newer push to the same pull request makes its running checks obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent guide covers every endpoint
        # The served guide is the agent contract's source of truth; a new
        # endpoint that isn't documented there is drift by definition. The
        # endpoint list comes from the transport's routing `when`, so this
        # check updates itself.
        run: |
          guide=src/main/resources/marginalis/agent-guide.md
          endpoints=$(grep -oE '"[a-z_]+" ->' src/main/kotlin/dev/marginalis/plugin/transport/MarginalisRestService.kt | sed -E 's/"([a-z_]+)" ->/\1/')
          [ -n "$endpoints" ] || { echo "found no endpoints to check — parser broken?"; exit 1; }
          missing=0
          for e in $endpoints; do
            grep -qE "^\| \`(GET|POST) $e[ ?\`]" "$guide" || { echo "MISSING from the guide's API table: $e"; missing=1; }
          done
          exit $missing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Install a virtual display
        # Margin tab tests that need an active IDE window skip themselves
        # without a display.
        run: sudo apt-get install -y xvfb
      # The IntelliJ Platform Gradle plugin sometimes drops the bundled Java
      # plugin from its index of the IDE (JetBrains/intellij-platform-gradle-plugin#2192,
      # fixed after 2.19.0), and the platform tests then run without Java. A
      # checked index is cached from main, so pull requests skip that race.
      - uses: actions/cache/restore@v4
        with:
          path: .intellijPlatform/layoutIndex
          key: ide-layout-index-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Index the IDE's bundled plugins
        run: |
          for attempt in 1 2 3; do
            ./gradlew dependencies --configuration compileClasspath --console=plain -q > /dev/null
            complete=true
            for index in .intellijPlatform/layoutIndex/*.json; do
              if ! jq -e 'any(.entries[]; .id == "com.intellij.java")' "$index" > /dev/null; then
                echo "Attempt $attempt: $index lacks the Java plugin; rebuilding it."
                rm -f "$index"
                complete=false
              fi
            done
            [ "$complete" = true ] && exit 0
          done
          echo "The IDE index still lacks the Java plugin after 3 attempts."
          exit 1
      - uses: actions/cache/save@v4
        # schreko_stable too: the fork's pull requests go into it and read its caches.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/schreko_stable')
        with:
          path: .intellijPlatform/layoutIndex
          key: ide-layout-index-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build plugin
        # `build` alone runs checks but does not produce the distributable
        # zip — `buildPlugin` does.
        run: xvfb-run -a ./gradlew build buildPlugin --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            build/test-results/test/
            core/build/test-results/test/
      - uses: actions/upload-artifact@v4
        with:
          name: marginalis-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  e2e:
    # The sandbox scenarios on the free runner: sandbox IDEs in Docker on a virtual screen, the plugin built once.
    # Fewer sandboxes than on a desktop (4 vCPU, 16 GB); docs/testing.md has the measured settings.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Sandbox scenarios
        env:
          MARGINALIS_SANDBOX_RUNTIME: ${{ github.workspace }}/build/sandbox-runtime
        run: ./gradlew uiSandboxTest -Pmarginalis.sandbox.jobs=4 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            build/test-results/uiSandboxTest/
            build/sandbox-runtime/*/run.log
            build/sandbox-runtime/*/diagnostics/
            build/sandbox-runtime/shots/
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
