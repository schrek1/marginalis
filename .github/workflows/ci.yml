# CI: build + verify on every push/PR.
#
# CI is deliberately the *honest* environment: unrestricted network means it
# compiles against the real ideaIC-2025.2 floor (the tenant dev sandbox
# can't reach the JetBrains CDN and uses a local IDE via the
# `marginalis.localIde` property instead) and runs the Plugin Verifier
# against the floor and the latest IntelliJ IDEA (`marginalis.latestIde`).
name: CI

on:
  push:
    # schreko_stable is the fork's integration branch: its pushes also fill the Gradle cache its pull requests read.
    branches: [main, schreko_stable]
  pull_request:
  # The manual fallback for a stable release (`stable.py release` dispatches it on schreko_stable): the whole run, so the
  # release still ships the zip this run tested.
  workflow_dispatch:
    inputs:
      force:
        description: Release even when nothing the plugin is built from changed
        type: boolean
        default: false

# A newer push to the same pull request makes its running checks obsolete. Runs on schreko_stable never overlap: the
# next one plans its release only after the previous one has tagged its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner image is pinned: `ubuntu-latest` moved to Ubuntu 26, and that move is made on purpose (MARG-142).
jobs:
  package:
    # The plugin is built once, and every later job tests that zip; a broken compile stops the run here. The one
    # writer of the IDE index, so an index is built at most once per key. On schreko_stable it also plans the release
    # and builds the zip under the release's version, so the release ships what test, verify and e2e checked.
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release plan compares with the previous stable tag.
          fetch-depth: ${{ github.ref == 'refs/heads/schreko_stable' && github.event_name != 'pull_request' && '0' || '1' }}
      - name: Release plan
        id: plan
        if: github.ref == 'refs/heads/schreko_stable' && github.event_name != 'pull_request'
        run: |
          force=""; [ "${{ inputs.force }}" = true ] && force=--force
          python3 scripts/stable_release.py plan "$GITHUB_SHA" $force | tee -a "$GITHUB_OUTPUT"
      - name: Release version
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" build.gradle.kts && grep -q "^version = \"$VERSION\"$" build.gradle.kts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: ./.github/actions/ide-layout-index
        with:
          save: "true"
      - name: Build the plugin zip
        run: ./gradlew buildPlugin --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: marginalis-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  test:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Agent guide covers every endpoint
        # The served guide is the agent contract's source of truth; a new
        # endpoint that isn't documented there is drift by definition. The
        # endpoint list comes from the transport's routing `when`, so this
        # check updates itself.
        run: |
          guide=src/main/resources/marginalis/agent-guide.md
          endpoints=$(grep -oE '"[a-z_]+" ->' src/main/kotlin/dev/marginalis/plugin/transport/MarginalisRestService.kt | sed -E 's/"([a-z_]+)" ->/\1/')
          [ -n "$endpoints" ] || { echo "found no endpoints to check — parser broken?"; exit 1; }
          missing=0
          for e in $endpoints; do
            grep -qE "^\| \`(GET|POST) ${e}[ ?\`]" "$guide" || { echo "MISSING from the guide's API table: $e"; missing=1; }
          done
          exit $missing
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The only job that writes the Gradle cache: every job writing its own dependencies and transforms (2-4 GB
          # each, a new hash per push) went past the repository's 10 GB, and the entries evicted each other. The
          # other jobs restore this job's entry.
          cache-read-only: ${{ github.event_name != 'push' }}
          # The default since v6, named to record the choice: its Terms of Use are free for a public repository, and
          # `basic` neither cleans up nor deduplicates, which would take the cache past 10 GB again.
          cache-provider: enhanced
      - name: Install a virtual display
        # Margin tab tests that need an active IDE window skip themselves
        # without a display.
        run: sudo apt-get install -y xvfb
      # Without the Java plugin in the IDE index, the platform tests run without Java.
      - uses: ./.github/actions/ide-layout-index
      - name: Tests and checks
        run: xvfb-run -a ./gradlew build --console=plain
      - name: Tests of the CI scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          include-hidden-files: true
          path: |
            build/test-results/test/
            core/build/test-results/test/

  e2e-plan:
    # Splits the scenarios between the e2e shards by their live durations: the median over the last green runs on
    # schreko_stable, planned while package builds, so it costs no time and nobody maintains a map. Planning is an
    # optimisation: when it fails the shards split by name and warn, and nothing else changes.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      planned: ${{ steps.plan.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - name: Shard map from the last green runs
        id: plan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/shard_map.py "${{ github.repository }}" --runs 10 --out build/e2e-plan/shards.json
      - uses: actions/upload-artifact@v7
        if: steps.plan.outcome == 'success'
        with:
          name: e2e-shard-map
          path: build/e2e-plan/shards.json
          if-no-files-found: error

  e2e-shard:
    # The sandbox scenarios on the free runner: sandbox IDEs in Docker on a virtual screen, running package's zip.
    # Fewer sandboxes than on a desktop (4 vCPU, 16 GB); docs/testing.md has the measured settings. Two runners split
    # the scenarios by e2e-plan's map, so both finish at about the same time.
    name: e2e (${{ matrix.shard }}/2)
    needs: [package, e2e-plan]
    # A failed plan only costs the balance; the shards then split by name.
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: marginalis-plugin
          path: build/package
      - uses: actions/download-artifact@v8
        # Without a plan the harness splits by name and says so.
        if: needs.e2e-plan.outputs.planned == 'true'
        with:
          name: e2e-shard-map
          path: sandbox
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: ./.github/actions/ide-layout-index
      - name: Sandbox scenarios
        env:
          MARGINALIS_SANDBOX_RUNTIME: ${{ github.workspace }}/build/sandbox-runtime
        run: >-
          ./gradlew uiSandboxTest -Pmarginalis.sandbox.jobs=4 -Pmarginalis.sandbox.shard=${{ matrix.shard }}/2
          -Pmarginalis.pluginZip="$(ls build/package/*.zip)" --console=plain
      - name: Shard map notes
        if: ${{ !cancelled() }}
        run: |
          notes=build/sandbox-runtime/shard-map-notes.txt
          [ ! -f "$notes" ] || while IFS= read -r note; do echo "::warning title=Shard map::$note"; done < "$notes"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # Its JUnit results are what sandbox/shards.json is rebuilt from (docs/testing.md).
          name: e2e-reports-${{ matrix.shard }}
          path: |
            build/test-results/uiSandboxTest/
            build/sandbox-runtime/*/run.log
            build/sandbox-runtime/*/diagnostics/
            build/sandbox-runtime/shots/
          if-no-files-found: ignore

  e2e:
    # The one e2e check that the release job and stable.py name: green only when every shard was. It also reports how
    # long each shard took and warns when the shard map no longer splits the scenarios evenly.
    needs: e2e-shard
    # A failed shard must still fail this check; a run cancelled by a newer push reports nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every shard passed
        run: '[ "${{ needs.e2e-shard.result }}" = success ] || { echo "e2e shards: ${{ needs.e2e-shard.result }}"; exit 1; }'
      - uses: actions/checkout@v7
      - name: Shard times
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/e2e_shard_balance.py "${{ github.repository }}" "${{ github.run_id }}"

  verify:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: marginalis-plugin
          path: build/package
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: ./.github/actions/ide-layout-index
      - name: Run IntelliJ Plugin Verifier on package's zip
        run: ./gradlew verifyPlugin -Pmarginalis.pluginZip="$(ls build/package/*.zip)" --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier
          if-no-files-found: ignore

  cache-prune:
    # setup-gradle saves a changed Gradle home under new hashes and leaves the replaced entries behind: a few pushes a
    # day took the repository's cache to its 10 GB limit. Once test, the Gradle cache's writer, has saved, this branch's
    # replaced entries go (scripts/prune_gradle_caches.py).
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete replaced Gradle cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_gradle_caches.py "${{ github.repository }}" "${{ github.ref }}"

  release:
    # A green run on schreko_stable is the release, of the zip package built and this run tested (package's plan says
    # whether there is one to make). It runs inside this run because a tag pushed with GITHUB_TOKEN would start no other
    # workflow.
    needs: [package, test, e2e, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/schreko_stable'
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/stable-release.yml
    with:
      release: ${{ needs.package.outputs.release == 'true' }}
      version: ${{ needs.package.outputs.version }}
      reason: ${{ needs.package.outputs.reason }}
