# Release: tag v* -> build the zip and attach it to a GitHub Release.
# (JetBrains Marketplace publishing can hang off this later with a
# PUBLISH_TOKEN secret and `./gradlew publishPlugin`.)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# The runner image is pinned: `ubuntu-latest` moved to Ubuntu 26, and that move is made on purpose (MARG-142).
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build plugin
        run: ./gradlew buildPlugin --console=plain
      # Sign + publish to JetBrains Marketplace when the four secrets exist;
      # a repo without them still gets its GitHub Release from every tag.
      # (Secrets can't appear in `if:` — hence the shell guard.)
      - name: Publish to JetBrains Marketplace
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "PUBLISH_TOKEN not set — skipping Marketplace publish."
            exit 0
          fi
          ./gradlew publishPlugin --console=plain
      # The release opens with the version's changelog section. Credit links
      # like [@name](https://github.com/name) become bare @name mentions,
      # which GitHub links and notifies; the Marketplace keeps the links.
      - name: Release notes from the changelog
        run: |
          ./gradlew getChangelog --project-version="${GITHUB_REF_NAME#v}" --no-header --no-links --console=plain -q \
            | sed -E 's#\[@([A-Za-z0-9-]+)\]\(https://github\.com/[A-Za-z0-9-]+\)#@\1#g' > build/release-notes.md
          test -s build/release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*.zip
          body_path: build/release-notes.md
          generate_release_notes: true
