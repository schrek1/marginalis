# Stable release of the fork: a green run on schreko_stable releases itself (ci.yml's `release` job calls this
# workflow). ci.yml's `package` plans it (`scripts/stable_release.py plan`: the next `<upstream>-schreko.N`, or a skip
# when nothing the plugin is built from changed) and builds the zip under that version; test, verify and e2e check that
# zip, and this workflow ships it: the tag with the GitHub Release that carries the zip, and the stable channel's
# updatePlugins.xml on GitHub Pages. A red run tags nothing. Then the fork issues of the merges since the previous
# release, and the merged PR, are told what came of it.
# Every IDE subscribes once to https://schrek1.github.io/marginalis/updatePlugins.xml.
# (`v*` tags belong to release.yml, which publishes to the Marketplace.)
name: Stable release

on:
  workflow_call:
    inputs:
      release:
        description: Whether package's plan releases this commit
        type: boolean
        required: true
      version:
        description: The release's version, the one package built the zip under
        type: string
        default: ""
      reason:
        description: Why the plan releases or skips
        type: string
        default: ""

# The runner image is pinned: `ubuntu-latest` moved to Ubuntu 26, and that move is made on purpose (MARG-142).
jobs:
  release:
    if: inputs.release
    runs-on: ubuntu-24.04
    # Belt and braces: ci.yml's concurrency already keeps runs on schreko_stable from overlapping.
    concurrency:
      group: stable-release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}/updatePlugins.xml
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes compare with the previous stable tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: marginalis-plugin
          path: build/package
      - name: The tested zip, under a version not released yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          zip="build/package/marginalis-$VERSION.zip"
          [ -f "$zip" ] || { echo "package built $(ls build/package), not marginalis-$VERSION.zip"; exit 1; }
          [ -z "$(git tag -l "$VERSION")" ] || { echo "$VERSION is already tagged; this run planned before it was"; exit 1; }
          sha256sum "$zip"
      - name: Release notes and plugin repository
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # A local tag only, for the notes; the GitHub Release below creates the real one.
          git tag "$VERSION" "$GITHUB_SHA"
          python3 scripts/stable_channel.py "$VERSION" "$GITHUB_REPOSITORY" site
      - name: Create GitHub Release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh release create "$VERSION" "build/package/marginalis-$VERSION.zip" --target "$GITHUB_SHA"
          --title "$VERSION" --notes-file site/release-notes.md
      - uses: actions/configure-pages@v6
        id: pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5

  follow-up:
    needs: release
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tell the fork issues and the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.release.result }}
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT/$RELEASE" in
            success/true) outcome=success ;;
            skipped/false) outcome=skipped ;;
            cancelled/*) outcome=cancelled ;;
            *) outcome=failure ;;
          esac
          python3 scripts/stable_release.py follow-up "$GITHUB_SHA" --outcome "$outcome" \
            --version "$VERSION" --reason "$REASON" --run-url "$RUN_URL"
