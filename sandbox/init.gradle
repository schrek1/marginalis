// Applied with `--init-script`: adds `runIdeForUiTests` (ui-ide.gradle) to a Marginalis checkout whose build lacks it,
// such as an upstream-ready feature branch, without touching that build.

def uiIde = new File(buildscript.sourceFile.parentFile, 'ui-ide.gradle')

gradle.rootProject { project ->
    project.pluginManager.withPlugin('org.jetbrains.intellij.platform') {
        project.apply(from: uiIde)
    }
}
